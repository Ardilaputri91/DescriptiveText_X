<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Family – Descriptive Text Independent Task</title>
<style>
:root{--navy:#173b63;--blue:#2b6ea6;--pink:#e96782;--ink:#26323d;--muted:#697887;--line:#d7e0e7;--bg:#f5f7f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{max-width:860px;margin:auto;padding:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 4px 16px rgba(23,59,99,.06)}
.hero{background:linear-gradient(135deg,#fffaf1,#f3f8fc)}h1{margin:6px 0;color:var(--navy);font-size:32px}h2{color:var(--navy);margin:0 0 10px}.subtitle{color:var(--pink);font-weight:800}.note{color:var(--muted);font-size:14px;line-height:1.55}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-weight:800;color:var(--navy)}.timer{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:900;min-width:88px;text-align:center;font-variant-numeric:tabular-nums}.timer.warning{color:#9b6200;border-color:#e4bd68}.timer.danger{color:#b52d2d;border-color:#df9292}
.progress{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.step{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#edf1f4;color:#687684}.step.active{background:#dceaf6;color:var(--navy)}.step.done{background:#e1f3ea;color:#287957}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}label{font-weight:700;font-size:14px}input[type=text],textarea{width:100%;margin-top:7px;border:1px solid #c9d3dc;border-radius:10px;padding:12px;font:inherit}textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,button:focus{outline:3px solid rgba(43,110,166,.2);outline-offset:2px}
button{border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf3f8;color:var(--navy)}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.passage{background:#fffdf8;border-left:4px solid #e4b45a;border-radius:10px;padding:16px;line-height:1.7;white-space:pre-line;max-height:360px;overflow:auto}.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;color:#80601e;margin:16px 0 7px}.count{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 7px}.question{font-size:20px;font-weight:800;line-height:1.45;margin-bottom:16px}.options{display:grid;gap:10px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.option:hover{background:#f8fbfd}.option input{margin-top:3px}
.crossword-wrap{overflow:auto;padding:4px}.crossword{display:grid;grid-template-columns:repeat(19,30px);grid-auto-rows:30px;gap:2px;width:max-content;margin:auto}.cell{width:30px;height:30px}.open{background:#fff;border:1px solid #9eabb6;position:relative}.block{background:transparent}.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-weight:900;font-size:16px;text-transform:uppercase;padding:0}.cell.active{background:#e8f2fa}.cell-num{position:absolute;left:2px;top:1px;font-size:7px;font-weight:900;color:#5e6c78;z-index:2;pointer-events:none}.clues{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.clues h4{color:var(--navy);margin:0 0 8px}.clue{font-size:14px;line-height:1.45;margin:6px 0}.success{text-align:center;padding:36px 18px}.success-icon{font-size:50px}.error{background:#fff0f0;border:1px solid #efb0b0;color:#9c3030;border-radius:10px;padding:12px;margin-top:12px}
@media(max-width:650px){.app{padding:9px}.panel{padding:16px}h1{font-size:27px}.form-grid,.clues{grid-template-columns:1fr}.question{font-size:18px}.crossword{grid-template-columns:repeat(19,27px);grid-auto-rows:27px}.cell{width:27px;height:27px}.cell input{font-size:14px}}
</style>
</head>
<body class="notranslate">
<main id="app" class="app"><section class="panel">Loading task...</section></main>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
let S=null,state={screen:'start',part:'A',index:0,startMs:0,answers:{},submitted:false},timer=null;
let order={A:[],B:[],C:[]},grid={};
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const A=[
{id:'A1',q:"What is Mr. Harris's occupation?",o:["Teacher","Civil engineer","Doctor","Police officer"]},
{id:'A2',q:"How many children do the Harris couple have?",o:["Two","Three","Four","Five"]},
{id:'A3',q:"What does Maya enjoy doing?",o:["Playing football","Reading books","Painting and playing the violin","Gardening"]},
{id:'A4',q:"Who are Ethan and Sophie?",o:["Daniel's brothers","Daniel's cousins","Daniel's parents","Daniel's teachers"]},
{id:'A5',q:"What does Mrs. Evelyn Harris like to do in her free time?",o:["Reading and gardening","Swimming and cooking","Painting and singing","Traveling and shopping"]},
{id:'A6',q:"Where did the Harris family go for vacation last summer?",o:["Jakarta","Bandung","Bali","Yogyakarta"]},
{id:'A7',q:"What values does the Harris family believe are important for a happy family?",o:["Money, success, and fame","Love, respect, and communication","Competition, achievement, and wealth","Discipline, punishment, and competition"]},
{id:'A8',q:'Find a word in the text that means "very close and loving relationship."',o:["memorable","retired","close-knit","traditional"]},
{id:'A9',q:"What can we learn from the Harris family's story?",o:["Family members should always live together.","Family members should support and care for each other.","Family members should avoid spending time together.","Family members should focus only on their own lives."]}
];
const B=[
{id:'B1',s:'Mr. Wilson is a teacher.'},{id:'B2',s:'Lily and Grace are sisters.'},{id:'B3',s:"Anna is Mr. Wilson's sister."},{id:'B4',s:"Jack is Lily and Grace's cousin."},{id:'B5',s:'Grandpa George lives with the family.'},{id:'B6',s:'Grandpa George teaches the girls chess.'},{id:'B7',s:'The family always eats breakfast together.'},{id:'B8',s:'Jack loves playing basketball.'},{id:'B9',s:'The family visits the beach every weekend.'},{id:'B10',s:'The Wilson family values spending time together.'}
];
const C=[
{id:'C1',s:'My grandfather is very OLD, but he is still energetic.',o:["young","strong","tired"]},
{id:'C2',s:'They rarely fight because they have a HARMONIOUS relationship.',o:["peaceful","friendly","quarrelsome"]},
{id:'C3',s:'The children were HAPPY when they saw their family.',o:["sad","excited","cheerful"]},
{id:'C4',s:'He is the ELDEST son in the family.',o:["youngest","middle","oldest"]},
{id:'C5',s:'My aunt is always BUSY with her work.',o:["free","available","occupied"]},
{id:'C6',s:'We have a CLOSE bond with our cousins.',o:["strong","distant","tight"]},
{id:'C7',s:'She is very PATIENT with her little brother.',o:["kind","annoyed","calm"]},
{id:'C8',s:'It is important to be HONEST with our family.',o:["truthful","unfair","dishonest"]},
{id:'C9',s:'He gave me a GENEROUS gift on my birthday.',o:["kind","selfish","thoughtful"]},
{id:'C10',s:"Our family's opinion is SIMILAR on this matter.",o:["same","different","equal"]}
];

document.addEventListener('contextmenu',e=>{if(state.screen==='task')e.preventDefault()});
document.addEventListener('selectstart',e=>{if(state.screen==='task'&&!['INPUT','TEXTAREA'].includes(e.target.tagName))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(state.screen==='task'&&!['INPUT','TEXTAREA'].includes(e.target.tagName))e.preventDefault()});
document.addEventListener('keydown',e=>{
 if(state.screen!=='task')return;
 const k=e.key.toLowerCase(), edit=['INPUT','TEXTAREA'].includes(e.target.tagName);
 if((e.ctrlKey||e.metaKey)&&['c','x','u','s'].includes(k)){e.preventDefault();return}
 if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();return}
});
document.addEventListener('change',e=>{
 if(e.target.matches('input[type=radio]'))state.answers[e.target.name]=e.target.value;
});
document.addEventListener('input',e=>{
 if(e.target.matches('textarea'))state.answers[e.target.id]=e.target.value;
});
window.addEventListener('beforeunload',e=>{if(state.screen==='task'&&!state.submitted){e.preventDefault();e.returnValue='Your assignment is not submitted yet.'}});

function start(){
 const name=$('#name').value.trim(),cls=$('#className').value.trim(),err=$('#startErr'),btn=$('#startBtn');
 if(!name||!cls){err.innerHTML='<div class="error">Please enter your full name and class.</div>';return}
 btn.disabled=true;btn.textContent='CHECKING...';
 google.script.run.withSuccessHandler(r=>{
   if(r.exists){err.innerHTML='<div class="error">A submission for this name and class already exists.</div>';btn.disabled=false;btn.textContent='START TASK';return}
   state={screen:'task',part:'A',index:0,startMs:Date.now(),answers:{},submitted:false,name,className:cls};
   order={A:shuffle([...Array(9).keys()]),B:shuffle([...Array(10).keys()]),C:shuffle([...Array(10).keys()])};
   buildGrid();render();runTimer();
 }).withFailureHandler(()=>{err.innerHTML='<div class="error">Unable to start. Please try again.</div>';btn.disabled=false;btn.textContent='START TASK'}).checkExistingSubmission(name,cls);
}
function renderStart(){
 app.innerHTML=`<section class="panel hero"><div class="subtitle">ENGLISH • GRADE X</div><h1>MY FAMILY</h1><div class="subtitle">Descriptive Text – Independent Task</div>
 <p>Read, think, answer, and reflect. Complete all parts individually.</p><p class="note"><b>Time:</b> ${S.durationMinutes} minutes &nbsp;•&nbsp; <b>Work:</b> Individual</p>
 <div class="form-grid"><div><label for="name">Full Name</label><input id="name" type="text" maxlength="100" placeholder="Type your full name"></div><div><label for="className">Class</label><input id="className" type="text" maxlength="30" placeholder="Example: X-3"></div></div>
 <p class="note">Check your name and class carefully before starting.</p><div id="startErr"></div><div class="actions"><button id="startBtn" class="primary">START TASK</button></div></section>`;
 $('#startBtn').onclick=start;
}
function top(){
 const ps=['A','B','C','D','E'],ix=ps.indexOf(state.part);
 return `<div class="top"><div class="brand">MY FAMILY • ENGLISH TASK</div><div id="timer" class="timer">100:00</div></div><div class="progress">${ps.map((p,i)=>`<span class="step ${i===ix?'active':i<ix?'done':''}">${i<ix?'✓ ':''}PART ${p}</span>`).join('')}</div>`;
}
function render(){app.innerHTML=top()+'<section id="panel" class="panel"></section>'; if(state.part==='A')partA();else if(state.part==='B')partB();else if(state.part==='C')partC();else if(state.part==='D')partD();else partE();updateTimer()}
function passage(t){return `<div class="label">Reading Text</div><div class="passage">${esc(t)}</div>`}
function next(label){return `<div class="actions"><button id="next" class="primary">${label}</button></div>`}
function partA(){
 const p=$('#panel'),d=A[order.A[state.index]];
 p.innerHTML=`<h2>PART A – Reading Comprehension</h2><p>Read the text carefully, then answer the questions.</p>${passage(S.texts.harris)}
 <div class="count">Question ${state.index+1} of 9</div><div class="question">${esc(d.q)}</div><div class="options">${shuffle(d.o).map((x,i)=>`<label class="option"><input type="radio" name="${d.id}" value="${esc(x)}" ${state.answers[d.id]===x?'checked':''}><span>${String.fromCharCode(65+i)}. ${esc(x)}</span></label>`).join('')}</div>
 ${state.index===8?`<div style="margin-top:18px"><label for="A10">Question 10 – If you were Daniel, how would you describe your family in three adjectives? Why?</label><textarea id="A10" maxlength="1000" placeholder="Write three adjectives and a short reason...">${esc(state.answers.A10||'')}</textarea></div>`:''}${next(state.index===8?'NEXT TO PART B':'NEXT')}`;
 $('#next').onclick=()=>{if(!state.answers[d.id]){alert('Please choose an answer before continuing.');return}if(state.index<8){state.index++;render()}else{state.answers.A10=$('#A10').value.trim();state.part='B';state.index=0;render()}};
}
function partB(){
 const p=$('#panel'),d=B[order.B[state.index]];
 p.innerHTML=`<h2>PART B – True or False</h2><p>Read the text carefully. Choose TRUE if the statement is correct and FALSE if it is not.</p>${passage(S.texts.wilson)}
 <div class="count">Statement ${state.index+1} of 10</div><div class="question">${esc(d.s)}</div><div class="options">${['TRUE','FALSE'].map(x=>`<label class="option"><input type="radio" name="${d.id}" value="${x}" ${state.answers[d.id]===x?'checked':''}><span>${x}</span></label>`).join('')}</div>${next(state.index===9?'NEXT TO PART C':'NEXT')}`;
 $('#next').onclick=()=>{if(!state.answers[d.id]){alert('Please choose TRUE or FALSE before continuing.');return}if(state.index<9){state.index++;render()}else{state.part='C';state.index=0;render()}};
}
function partC(){
 const p=$('#panel'),d=C[order.C[state.index]];
 p.innerHTML=`<h2>PART C – Antonyms</h2><p>Choose the word that has the opposite meaning of the underlined word.</p>
 <div class="count">Question ${state.index+1} of 10</div><div class="question">${esc(d.s)}</div><div class="options">${shuffle(d.o).map((x,i)=>`<label class="option"><input type="radio" name="${d.id}" value="${esc(x)}" ${state.answers[d.id]===x?'checked':''}><span>${String.fromCharCode(65+i)}. ${esc(x)}</span></label>`).join('')}</div>${next(state.index===9?'NEXT TO PART D':'NEXT')}`;
 $('#next').onclick=()=>{if(!state.answers[d.id]){alert('Please choose an answer before continuing.');return}if(state.index<9){state.index++;render()}else{state.part='D';state.index=0;render()}};
}
function buildGrid(){
 grid.cells={};S.crossword.entries.forEach(e=>{for(let i=0;i<e.length;i++){let r=e.row+(e.dir==='D'?i:0),c=e.col+(e.dir==='A'?i:0),k=r+','+c;(grid.cells[k]??={r,c,ids:[]}).ids.push(e.id)}});
}
function partD(){
 const p=$('#panel');let cells='';
 for(let r=0;r<S.crossword.size;r++)for(let c=0;c<S.crossword.size;c++){
  const k=r+','+c,cell=grid.cells[k];
  if(!cell){cells+='<div class="cell block"></div>';continue}
  const starts=S.crossword.entries.filter(e=>e.row===r&&e.col===c),v=state.answers['CELL_'+k]||'';
  cells+=`<div class="cell open" data-cell="${k}">${starts.length?`<span class="cell-num">${starts.map(e=>e.number).join('/')}</span>`:''}<input maxlength="1" data-ci="${k}" value="${esc(v)}"></div>`;
 }
 const ac=S.crossword.entries.filter(e=>e.dir==='A').sort((a,b)=>a.number-b.number),dn=S.crossword.entries.filter(e=>e.dir==='D').sort((a,b)=>a.number-b.number);
 p.innerHTML=`<h2>PART D – Family Crossword</h2><p>Read the clues and fill in the crossword puzzle with the correct family member. Type one letter in each box. There is no answer bank.</p>
 <div class="crossword-wrap"><div class="crossword">${cells}</div></div><div class="clues"><div><h4>ACROSS</h4>${ac.map(e=>`<div class="clue"><b>${e.number}.</b> ${esc(e.clue)}</div>`).join('')}</div><div><h4>DOWN</h4>${dn.map(e=>`<div class="clue"><b>${e.number}.</b> ${esc(e.clue)}</div>`).join('')}</div></div>${next('NEXT TO PART E')}`;
 document.querySelectorAll('[data-ci]').forEach(el=>{el.oninput=()=>{let v=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(-1);el.value=v;state.answers['CELL_'+el.dataset.ci]=v;if(v){let all=[...document.querySelectorAll('[data-ci]')],i=all.indexOf(el);if(all[i+1])all[i+1].focus()}};el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value){let all=[...document.querySelectorAll('[data-ci]')],i=all.indexOf(el);if(i>0)all[i-1].focus()}}});
 $('#next').onclick=()=>{state.part='E';state.index=0;render()};
}
function partE(){
 const p=$('#panel');
 p.innerHTML=`<h2>PART E – Reflection</h2><p>Think about what you have learned from this activity.</p>
 <label for="R1">1. What was the easiest part of this task?</label><textarea id="R1" maxlength="1000">${esc(state.answers.R1||'')}</textarea>
 <label for="R2">2. What was the most difficult part?</label><textarea id="R2" maxlength="1000">${esc(state.answers.R2||'')}</textarea>
 <label for="R3">3. Write one new English word you learned.</label><textarea id="R3" maxlength="1000">${esc(state.answers.R3||'')}</textarea>
 <label for="R4">4. What do you need to improve in English?</label><textarea id="R4" maxlength="1000">${esc(state.answers.R4||'')}</textarea>
 <div style="margin-top:18px"><label for="A10final">Question 10 – Three adjectives + a short reason</label><textarea id="A10final" maxlength="1000">${esc(state.answers.A10||'')}</textarea></div>${next('SUBMIT MY WORK')}`;
 $('#next').onclick=()=>submit(false);
}
function runTimer(){clearInterval(timer);updateTimer();timer=setInterval(updateTimer,1000)}
function updateTimer(){let total=S.durationMinutes*60000,left=Math.max(0,total-(Date.now()-state.startMs)),sec=Math.ceil(left/1000),m=Math.floor(sec/60),s=sec%60,el=$('#timer');if(el){el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.className='timer'+(sec<=300?' danger':sec<=1200?' warning':'')}if(left<=0){clearInterval(timer);submit(true)}}
function crosswordWords(){
 const o={};S.crossword.entries.forEach(e=>{let w='';for(let i=0;i<e.length;i++){let r=e.row+(e.dir==='D'?i:0),c=e.col+(e.dir==='A'?i:0);w+=(state.answers['CELL_'+r+','+c]||'').toUpperCase()}o[e.id]=w});return o;
}
function submit(auto){
 if(state.submitted)return;
 ['R1','R2','R3','R4'].forEach(id=>{let e=$('#'+id);if(e)state.answers[id]=e.value.trim()});
 let a10=$('#A10final');if(a10)state.answers.A10=a10.value.trim();
 if(!auto&&!confirm('Are you sure you want to submit? You cannot change your answers after submission.'))return;
 state.submitted=true;clearInterval(timer);Object.assign(state.answers,crosswordWords());
 const id=(crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now());
 app.innerHTML='<section class="panel success"><div class="success-icon">⏳</div><h2>SUBMITTING...</h2><p>Please wait while your work is recorded.</p></section>';
 google.script.run.withSuccessHandler(r=>{
  if(!r||!r.ok){state.submitted=false;app.innerHTML='<section class="panel"><h2>Submission Not Completed</h2><div class="error">'+esc(r?.message||'Please try again.')+'</div><div class="actions"><button id="retry" class="primary">TRY AGAIN</button></div></section>';$('#retry').onclick=()=>submit(false);return}
  const mm=Math.floor(r.elapsedSeconds/60),ss=r.elapsedSeconds%60;
  app.innerHTML=`<section class="panel success"><div class="success-icon">🎉</div><h2>TASK COMPLETED</h2><p>Thank you, <b>${esc(state.name)}</b>. Your assignment has been submitted successfully.</p><p class="note"><b>Class:</b> ${esc(state.className)}<br><b>Completion time:</b> ${mm}m ${ss}s</p><p class="note">Your work has been recorded. The teacher will review the open-ended responses.</p><p><b>You can now close this page.</b></p></section>`;
 }).withFailureHandler(()=>{state.submitted=false;app.innerHTML='<section class="panel"><h2>Submission Error</h2><div class="error">The server could not record your work. Please try again.</div><div class="actions"><button id="retry" class="primary">TRY AGAIN</button></div></section>';$('#retry').onclick=()=>submit(false)}).submitAssignment({name:state.name,className:state.className,startMs:state.startMs,submissionId:id,answers:state.answers});
}
google.script.run.withSuccessHandler(x=>{S=x;renderStart()}).withFailureHandler(()=>{app.innerHTML='<section class="panel"><h2>Unable to load task</h2><div class="error">Please ask the teacher to check the Apps Script setup.</div></section>'}).getSettings();
})();
</script>
</body>
</html>
